name: Test gh CLI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test gh commands
        run: |
          echo "Testing gh CLI..."
          gh auth status
          gh pr list --limit 1
          echo "✅ gh CLI works!"
